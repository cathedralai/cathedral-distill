# MCP servers for the Cathedral computer-use trace agent.
#
# Replaces the regulatory-intelligence profile's fetch/filesystem/time set. The
# desktop server is the whole job now; everything else supports recording.
#
# Hermes registers these as `mcp_computer_use_linux_<tool>` and creates the
# `mcp-computer-use-linux` runtime toolset. Install the companion skill first so
# Hermes has the desktop runbook:
#
#   hermes skills tap add agent-sh/computer-use-linux
#   hermes skills install agent-sh/computer-use-linux/computer-use-linux
#   hermes mcp add computer-use-linux --command computer-use-linux --args mcp
#   hermes mcp test computer-use-linux
#
# Verify the desktop side before asking the agent to drive it:
#
#   computer-use-linux doctor | jq .readiness

servers:

  computer-use-linux:
    command: computer-use-linux
    args: ["mcp"]
    timeout: 120
    connect_timeout: 30
    description: >-
      Linux desktop control over AT-SPI, GNOME Shell, Wayland portals and
      ydotool. Discovery (list_windows, list_apps, focused_window,
      get_app_state, screenshot), input (click, drag, scroll, press_key,
      type_text), semantic actions (perform_action, set_value) and navigation
      (activate_window, move_window, resize_window).

      Prefer element indices and semantic selectors over pixel coordinates:
      indices survive a window moving, and a coordinate-based trace cannot be
      replayed at a different resolution, which makes it useless as an eval
      item later.

  trace:
    command: python3
    args: ["-m", "cathedral_trace_mcp"]
    env:
      CATHEDRAL_TRACE_DIR: ${CATHEDRAL_TRACE_DIR}
      CATHEDRAL_TASK_ID: ${CATHEDRAL_TASK_ID}
      CATHEDRAL_HOTKEY_PATH: ${CATHEDRAL_HOTKEY_PATH}
    description: >-
      Trace recorder. Exposes:
        - record_step(step, reasoning, action, observation_ref) -> {step_hash}
        - check_predicate() -> {passed, detail}
        - finalise(outcome) -> {trace_id, steps, predicate_passed}

      Every step is appended and flushed immediately. A crashed run keeps the
      steps it already recorded rather than losing the episode, which matters
      because desktop episodes are slow and a lost one is expensive to redo.

# Expose the desktop tools to subagents as well, so a planner subagent can
# observe without round-tripping through the parent.
inherit_mcp_toolsets: true
