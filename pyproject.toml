[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cathedral-cybergym"
version = "0.1.0"
description = "Verified vulnerability-discovery subnet for Bittensor SN39"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Reading the OSS-Fuzz feed (operator tooling). Deliberately NOT a runtime dependency:
# nothing on the reward path parses YAML.
ingest = ["pyyaml>=6"]

[project.scripts]
cathedral-distill = "cathedral_distill.miner_cli:main"
cathedral-cybergym = "cathedral_distill.operator_cli:main"
cathedral-cybergym-verify = "cathedral_distill.cybergym_verify_cli:main"
cathedral-cybergym-agent = "cathedral_distill.cybergym_agent_cli:main"
cathedral-cybergym-server = "cathedral_distill.cybergym_repro_server:main"
cathedral-cybergym-fresh-e2e-server = "cathedral_distill.cybergym_fresh_server:main"
cathedral-cybergym-fresh-e2e-close = "cathedral_distill.cybergym_fresh_close:main"
cathedral-cybergym-private-v2-e2e-server = "cathedral_distill.cybergym_private_v2_server:main"
cathedral-cybergym-private-v2-e2e-close = "cathedral_distill.cybergym_private_v2_close:main"
cathedral-cybergym-pull = "cathedral_distill.corpus_images:main"
cathedral-cybergym-admit = "cathedral_distill.corpus_admission_stamp:main"

[tool.setuptools]
packages = ["cathedral_distill"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
