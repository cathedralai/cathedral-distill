[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cathedral-cybergym"
version = "0.1.0"
description = "Verified vulnerability-discovery subnet for Bittensor SN39"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["cathedral_distill"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
